name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Connect to Tailscale
      # =========================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # =========================
      # Login to GHCR
      # =========================
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # =========================
      # Build Docker Image
      # =========================
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/statuspulse:${{ github.sha }} .
          docker tag ghcr.io/${{ github.repository }}/statuspulse:${{ github.sha }} ghcr.io/${{ github.repository }}/statuspulse:latest

      # =========================
      # Push Docker Images
      # =========================
      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository }}/statuspulse:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/statuspulse:latest

      # =========================
      # Setup SSH
      # =========================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # =========================
      # Add Known Hosts
      # =========================
      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # =========================
      # Test SSH Connection
      # =========================
      - name: Test SSH Connection
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH CONNECTION SUCCESSFUL"

      # =========================
      # Deploy Application
      # =========================
      - name: Deploy Application
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

          set -e

          echo "Starting deployment..."

          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}

          PREVIOUS_IMAGE=\$(docker inspect statuspulse-app --format='{{.Config.Image}}' || true)

          docker pull ghcr.io/${{ github.repository }}/statuspulse:${{ github.sha }}

          docker stop statuspulse-app || true
          docker rm statuspulse-app || true

          docker run -d \
            --name statuspulse-app \
            -p 8000:8000 \
            --env-file .env \
            --restart unless-stopped \
            ghcr.io/${{ github.repository }}/statuspulse:${{ github.sha }}

          echo "Waiting for application startup..."
          sleep 15

          echo "Running health check..."

          if curl -f http://localhost:8000/health; then
            echo "Deployment successful"
          else
            echo "Deployment failed. Rolling back..."

            docker stop statuspulse-app || true
            docker rm statuspulse-app || true

            if [ ! -z "\$PREVIOUS_IMAGE" ]; then
              docker run -d \
                --name statuspulse-app \
                -p 8000:8000 \
                --env-file .env \
                --restart unless-stopped \
                \$PREVIOUS_IMAGE
            fi

            exit 1
          fi

          EOF

      # =========================
      # Success Notification
      # =========================
      - name: Success Notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: "✅ Deployment successful for commit: ${{ github.sha }}"
            })

      # =========================
      # Failure Notification
      # =========================
      - name: Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: "❌ Deployment failed for commit: ${{ github.sha }}"
            })
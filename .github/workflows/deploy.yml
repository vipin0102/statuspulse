name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: ./app

    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # =========================
      # Connect to Tailscale
      # =========================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # =========================
      # Login to GHCR
      # =========================
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # =========================
      # Build Docker Image
      # =========================
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/statuspulse:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/${{ github.repository }}/statuspulse:latest \
            .

      # =========================
      # Push Docker Images
      # =========================
      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository }}/statuspulse:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/${{ github.repository }}/statuspulse:latest

      # =========================
      # Setup SSH
      # =========================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # =========================
      # Add Known Hosts
      # =========================
      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # =========================
      # Test SSH Connection
      # =========================
      - name: Test SSH Connection
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH CONNECTION SUCCESSFUL"

      # =========================
      # Copy deployment files to server
      # Copies docker-compose.yml + .env so the server has everything it needs
      # =========================
      - name: Copy Files to Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ~/statuspulse"

          # Copy docker-compose.yml
          scp docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/statuspulse/docker-compose.yml

          # Copy Caddyfile — must sit next to docker-compose.yml on the server
          # because docker-compose.yml mounts it as ./Caddyfile
          scp ../caddy/Caddyfile \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/statuspulse/Caddyfile

          # Write .env from GitHub secrets
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -c "cat > ~/statuspulse/.env" << 'EOF'
          APP_PORT=8000
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          EOF

      # =========================
      # Deploy Application via Docker Compose
      # Uses compose on the server so postgres + redis start alongside the app
      # =========================
      - name: Deploy Application
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s \
            "$DEPLOY_SHA" "$REPO" "$GHCR_PAT" "$GH_ACTOR" << 'ENDSSH'

          set -e

          DEPLOY_SHA="$1"
          REPO="$2"
          GHCR_PAT="$3"
          GH_ACTOR="$4"
          WORKDIR="$HOME/statuspulse"

          echo "======================================"
          echo "Deploying SHA: ${DEPLOY_SHA}"
          echo "======================================"

          cd "$WORKDIR"

          # Verify .env exists
          if [ ! -f ".env" ]; then
            echo "ERROR: .env not found at $WORKDIR/.env"
            exit 1
          fi

          # Login to GHCR
          echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

          # Save previous image tag for rollback
          PREVIOUS_IMAGE=$(docker inspect statuspulse-app \
            --format='{{.Config.Image}}' 2>/dev/null || true)
          echo "Previous image: ${PREVIOUS_IMAGE:-none}"

          # Pull new image
          echo "Pulling new image..."
          docker pull "ghcr.io/${REPO}/statuspulse:${DEPLOY_SHA}"

          # Update IMAGE_TAG in env so compose uses the exact SHA image
          export IMAGE_TAG="${DEPLOY_SHA}"

          # Bring up full stack (app + postgres + redis) via compose
          # --no-build: use the image we just pulled
          # --pull never: don't try to pull postgres/redis again, they're already cached
          echo "Starting stack via Docker Compose..."
          APP_IMAGE="ghcr.io/${REPO}/statuspulse:${DEPLOY_SHA}" \
            docker compose \
              --env-file .env \
              -f docker-compose.yml \
              up -d --remove-orphans

          echo "Waiting for application startup (30s)..."
          sleep 30

          # Health check with retries — 8 attempts x 10s = 80s window
          echo "Running health check..."
          HEALTHY=false
          for i in $(seq 1 8); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$HTTP" = "200" ]; then
              BODY=$(curl -s http://localhost:8000/health)
              echo "Health response: $BODY"
              if echo "$BODY" | grep -q '"healthy"'; then
                HEALTHY=true
                break
              fi
            fi
            echo "Attempt $i/8 — HTTP $HTTP — retrying in 10s..."
            sleep 10
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "======================================"
            echo "Deployment successful!"
            echo "======================================"
            # Clean up old unused images to save disk space
            docker image prune -f || true
          else
            echo "======================================"
            echo "Health check failed — rolling back..."
            echo "======================================"

            # Print container logs for diagnosis
            echo "=== App container logs ==="
            docker logs statuspulse-app --tail 50 || true
            echo "=== Postgres logs ==="
            docker logs statuspulse-postgres --tail 20 || true
            echo "=== Redis logs ==="
            docker logs statuspulse-redis --tail 20 || true

            # Roll back: stop current stack and restart previous image
            docker compose -f docker-compose.yml down || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              echo "Restoring previous image: $PREVIOUS_IMAGE"
              # Patch compose to use the old image and bring stack back up
              APP_IMAGE="$PREVIOUS_IMAGE" \
                docker compose \
                  --env-file .env \
                  -f docker-compose.yml \
                  up -d --remove-orphans
              echo "Rollback complete"
            else
              echo "No previous image — stack left down"
            fi

            exit 1
          fi

          ENDSSH

      # =========================
      # Success Notification
      # =========================
      - name: Success Notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const shortSha = sha.substring(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                '## ✅ Deployment Successful',
                '',
                `**Commit:** \`${shortSha}\``,
                `**Full SHA:** \`${sha}\``,
                `**Image:** \`ghcr.io/${{ github.repository }}/statuspulse:${shortSha}\``,
                `**Triggered by:** @${{ github.actor }}`,
                `**Time:** ${new Date().toUTCString()}`,
              ].join('\n')
            })

      # =========================
      # Failure Notification
      # =========================
      - name: Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const shortSha = sha.substring(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                '## ❌ Deployment Failed — Rollback Triggered',
                '',
                `**Commit:** \`${shortSha}\``,
                `**Full SHA:** \`${sha}\``,
                `**Triggered by:** @${{ github.actor }}`,
                `**Time:** ${new Date().toUTCString()}`,
                '',
                '> The previous image has been restored. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions) for details.',
              ].join('\n')
            })
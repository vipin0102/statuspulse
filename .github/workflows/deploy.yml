name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: ./

    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # =========================
      # Connect to Tailscale
      # =========================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # =========================
      # Login to GHCR
      # =========================
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # =========================
      # Build Docker Image
      # =========================
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/statuspulse:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/${{ github.repository }}/statuspulse:latest \
            .

      # =========================
      # Push Docker Images
      # =========================
      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository }}/statuspulse:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/${{ github.repository }}/statuspulse:latest

      # =========================
      # Setup SSH
      # =========================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # =========================
      # Add Known Hosts
      # =========================
      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # =========================
      # Test SSH Connection
      # =========================
      - name: Test SSH Connection
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH CONNECTION SUCCESSFUL"

      # =========================
      # Copy Files to Server
      # Replicates the exact repo structure the compose file expects:
      #   ~/statuspulse/app/docker-compose.yml
      #   ~/statuspulse/caddy/Caddyfile
      #
      # Compose runs from ~/statuspulse/app/ so ../caddy/Caddyfile
      # correctly resolves to ~/statuspulse/caddy/Caddyfile — same as local dev.
      # =========================
      - name: Copy Files to Server
        run: |
          # Create directory structure mirroring the repo
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p ~/statuspulse/app ~/statuspulse/caddy"

          # Copy docker-compose.yml (runner working-dir = ./app)
          scp docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/statuspulse/app/docker-compose.yml

          # Copy Caddyfile (runner: ../caddy/Caddyfile = repo-root/caddy/Caddyfile)
          scp ./caddy/Caddyfile \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/statuspulse/caddy/Caddyfile

          # Write .env into app/ using printf to avoid heredoc YAML conflicts
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "printf 'APP_PORT=8000\nDB_HOST=postgres\nDB_PORT=5432\nDB_NAME=${{ secrets.DB_NAME }}\nDB_USER=${{ secrets.DB_USER }}\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nREDIS_HOST=redis\nREDIS_PORT=6379\nREDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}\n' > ~/statuspulse/app/.env"

          # Verify structure
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'VERIFY'
          set -e
          echo "=== Server deployment structure ==="
          ls -la ~/statuspulse/app/
          ls -la ~/statuspulse/caddy/
          [ -f ~/statuspulse/docker-compose.yml ] || { echo "ERROR: docker-compose.yml missing"; exit 1; }
          [ -f ~/statuspulse/caddy/Caddyfile ]        || { echo "ERROR: Caddyfile missing";          exit 1; }
          [ -f ~/statuspulse/.env ]               || { echo "ERROR: .env missing";               exit 1; }
          echo "OK: all required files present"
          VERIFY

      # =========================
      # Deploy Application via Docker Compose
      # Runs full stack: app + postgres + redis + caddy
      # =========================
      - name: Deploy Application
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s \
            "$DEPLOY_SHA" "$REPO" "$GHCR_PAT" "$GH_ACTOR" << 'ENDSSH'

          set -e

          DEPLOY_SHA="$1"
          REPO="$2"
          GHCR_PAT="$3"
          GH_ACTOR="$4"

          # Compose must run from app/ so ../caddy/Caddyfile resolves correctly
          WORKDIR="$HOME/statuspulse"

          echo "======================================"
          echo "Deploying SHA: ${DEPLOY_SHA}"
          echo "======================================"

          cd "$WORKDIR"

          # Guard — all files must exist before touching Docker
          [ -f ".env" ]              || { echo "ERROR: .env missing";              exit 1; }
          [ -f "docker-compose.yml" ] || { echo "ERROR: docker-compose.yml missing"; exit 1; }
          [ -f "../caddy/Caddyfile" ] || { echo "ERROR: ../caddy/Caddyfile missing"; exit 1; }
          echo "All required files verified"

          # Login to GHCR
          echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

          # Save current app image for rollback
          PREVIOUS_IMAGE=$(docker inspect statuspulse-app \
            --format='{{.Config.Image}}' 2>/dev/null || true)
          echo "Previous image: ${PREVIOUS_IMAGE:-none}"

          # Stop and remove any existing containers by name to avoid
          # "container name already in use" conflicts across deploys
          echo "Stopping existing containers..."
          docker stop statuspulse-app statuspulse-postgres statuspulse-redis statuspulse-caddy statuspulse-uptime-kuma 2>/dev/null || true
          docker rm   statuspulse-app statuspulse-postgres statuspulse-redis statuspulse-caddy statuspulse-uptime-kuma 2>/dev/null || true

          # Pull new image
          echo "Pulling new image..."
          docker pull "ghcr.io/${REPO}/statuspulse:${DEPLOY_SHA}"

          # Bring up full stack with the new image
          # --project-name ensures consistent naming regardless of working dir
          echo "Starting stack via Docker Compose..."
          APP_IMAGE="ghcr.io/${REPO}/statuspulse:${DEPLOY_SHA}" \
            docker compose \
              --project-name statuspulse \
              --env-file .env \
              -f docker-compose.yml \
              up -d --no-build --pull never --remove-orphans

          echo "Waiting for application startup (30s)..."
          sleep 30

          # Health check — 8 attempts x 10s = 80s window
          echo "Running health check..."
          HEALTHY=false
          for i in $(seq 1 8); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$HTTP" = "200" ]; then
              BODY=$(curl -s http://localhost:8000/health)
              echo "Health response: $BODY"
              if echo "$BODY" | grep -q '"healthy"'; then
                HEALTHY=true
                break
              fi
            fi
            echo "Attempt $i/8 — HTTP $HTTP — retrying in 10s..."
            sleep 10
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "======================================"
            echo "Deployment successful!"
            echo "======================================"
            docker image prune -f || true
          else
            echo "======================================"
            echo "Health check failed — rolling back..."
            echo "======================================"

            echo "=== App logs ==="      && docker logs statuspulse-app      --tail 50 || true
            echo "=== Postgres logs ===" && docker logs statuspulse-postgres --tail 20 || true
            echo "=== Redis logs ==="    && docker logs statuspulse-redis    --tail 20 || true
            echo "=== Caddy logs ==="    && docker logs statuspulse-caddy    --tail 20 || true

            docker compose --project-name statuspulse -f docker-compose.yml down || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              echo "Restoring previous image: $PREVIOUS_IMAGE"
              APP_IMAGE="$PREVIOUS_IMAGE" \
                docker compose \
                  --project-name statuspulse \
                  --env-file .env \
                  -f docker-compose.yml \
                  up -d --no-build --pull never --remove-orphans
              echo "Rollback complete"
            else
              echo "No previous image — stack left down"
            fi

            exit 1
          fi

          ENDSSH

      # =========================
      # Success Notification
      # =========================
      - name: Success Notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const shortSha = sha.substring(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                '## ✅ Deployment Successful',
                '',
                `**Commit:** \`${shortSha}\``,
                `**Full SHA:** \`${sha}\``,
                `**Image:** \`ghcr.io/${{ github.repository }}/statuspulse:${shortSha}\``,
                `**Triggered by:** @${{ github.actor }}`,
                `**Time:** ${new Date().toUTCString()}`,
              ].join('\n')
            })

      # =========================
      # Failure Notification
      # =========================
      - name: Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const shortSha = sha.substring(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                '## ❌ Deployment Failed — Rollback Triggered',
                '',
                `**Commit:** \`${shortSha}\``,
                `**Full SHA:** \`${sha}\``,
                `**Triggered by:** @${{ github.actor }}`,
                `**Time:** ${new Date().toUTCString()}`,
                '',
                '> The previous image has been restored. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions) for details.',
              ].join('\n')
            })


name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Only run if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: ./app

    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # =========================
      # Connect to Tailscale
      # =========================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # =========================
      # Login to GHCR
      # =========================
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # =========================
      # Build Docker Image
      # =========================
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/statuspulse:${{ github.event.workflow_run.head_sha }} \
            -t ghcr.io/${{ github.repository }}/statuspulse:latest \
            .

      # =========================
      # Push Docker Images
      # =========================
      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository }}/statuspulse:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/${{ github.repository }}/statuspulse:latest

      # =========================
      # Setup SSH
      # =========================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # =========================
      # Add Known Hosts
      # =========================
      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # =========================
      # Test SSH Connection
      # =========================
      - name: Test SSH Connection
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH CONNECTION SUCCESSFUL"

      # =========================
      # Deploy Application
      # =========================
      - name: Deploy Application
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << ENDSSH

          set -e

          echo "======================================"
          echo "Starting deployment of ${DEPLOY_SHA}"
          echo "======================================"

          # Login to GHCR on server
          echo "${GHCR_PAT}" | docker login ghcr.io -u ${GH_ACTOR} --password-stdin

          # Save current image for rollback
          PREVIOUS_IMAGE=\$(docker inspect statuspulse-app --format='{{.Config.Image}}' 2>/dev/null || true)
          echo "Previous image: \${PREVIOUS_IMAGE:-none}"

          # Pull new image
          echo "Pulling new image..."
          docker pull ghcr.io/${REPO}/statuspulse:${DEPLOY_SHA}

          # Stop and remove old container
          docker stop statuspulse-app 2>/dev/null || true
          docker rm   statuspulse-app 2>/dev/null || true

          # Run new container
          docker run -d \
            --name statuspulse-app \
            -p 8000:8000 \
            --env-file ~/statuspulse/.env \
            --restart unless-stopped \
            ghcr.io/${REPO}/statuspulse:${DEPLOY_SHA}

          echo "Waiting for application startup..."
          sleep 15

          # Health check with retries
          echo "Running health check..."
          HEALTHY=false
          for i in \$(seq 1 6); do
            if curl -sf http://localhost:8000/health | grep -q '"healthy"'; then
              HEALTHY=true
              break
            fi
            echo "Attempt \$i/6 failed, retrying in 5s..."
            sleep 5
          done

          if [ "\$HEALTHY" = "true" ]; then
            echo "======================================"
            echo "Health check passed — deployment done"
            echo "======================================"
          else
            echo "======================================"
            echo "Health check failed — rolling back..."
            echo "======================================"

            docker stop statuspulse-app 2>/dev/null || true
            docker rm   statuspulse-app 2>/dev/null || true

            if [ -n "\$PREVIOUS_IMAGE" ]; then
              echo "Restoring previous image: \$PREVIOUS_IMAGE"
              docker run -d \
                --name statuspulse-app \
                -p 8000:8000 \
                --env-file ~/statuspulse/.env \
                --restart unless-stopped \
                "\$PREVIOUS_IMAGE"
              echo "Rollback complete"
            else
              echo "No previous image to roll back to"
            fi

            exit 1
          fi

          ENDSSH

      # =========================
      # Success Notification
      # =========================
      - name: Success Notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const shortSha = sha.substring(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                '## ✅ Deployment Successful',
                '',
                `**Commit:** \`${shortSha}\``,
                `**Full SHA:** \`${sha}\``,
                `**Image:** \`ghcr.io/${{ github.repository }}/statuspulse:${shortSha}\``,
                `**Triggered by:** @${{ github.actor }}`,
                `**Time:** ${new Date().toUTCString()}`,
              ].join('\n')
            })

      # =========================
      # Failure Notification
      # =========================
      - name: Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const shortSha = sha.substring(0, 7);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: [
                '## ❌ Deployment Failed — Rollback Triggered',
                '',
                `**Commit:** \`${shortSha}\``,
                `**Full SHA:** \`${sha}\``,
                `**Triggered by:** @${{ github.actor }}`,
                `**Time:** ${new Date().toUTCString()}`,
                '',
                '> The previous image has been restored. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions) for details.',
              ].join('\n')
            })
name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Python Setup
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # Install Ruff
      # =========================
      - name: Install Ruff
        run: pip install ruff

      # =========================
      # Lint Python Code
      # =========================
      - name: Lint Python Code
        run: ruff check .

      # =========================
      # Hadolint — Scan Dockerfile
      # Path is relative to repo root (not working-directory)
      # =========================
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          ignore: DL3018,DL3059,DL3042,DL3013

      # =========================
      # Build Docker Image
      # Tag matches image: ${APP_IMAGE:-statuspulse:ci} default in docker-compose.yml
      # Must build BEFORE compose up so the image exists locally
      # =========================
      - name: Build Docker Image
        run: docker build -t statuspulse:ci .

      # =========================
      # Create .env from example
      # =========================
      - name: Create .env
        run: cp .env.example .env

      # =========================
      # Start Full Stack via Docker Compose
      # Working-dir is ./app so ../caddy/Caddyfile resolves correctly to
      # repo-root/caddy/Caddyfile which exists after checkout — no copy needed.
      # APP_IMAGE=statuspulse:ci tells compose to use the locally built image.
      # --no-build  → skip rebuilding, use the image we just built above
      # --pull never → don't try to pull statuspulse:ci from any registry
      # =========================
      - name: Start Docker Compose Stack
        run: |
          APP_IMAGE=statuspulse:ci docker compose up -d --no-build --pull never
          echo "Stack started"

      # =========================
      # Wait for App to be Healthy
      # 30 attempts x 5s = up to 150s timeout
      # Prints HTTP status on each retry for easy diagnosis
      # Dumps logs if it never becomes healthy
      # =========================
      - name: Wait for App Health
        run: |
          echo "Waiting for application to become healthy..."

          for i in $(seq 1 30); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$RESPONSE" = "200" ]; then
              echo "Application is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 — HTTP $RESPONSE — retrying in 5s..."
            sleep 5
          done

          echo "Application failed to become healthy within 150s"
          echo ""
          echo "=== Docker Compose Logs ==="
          docker compose logs
          exit 1

      # =========================
      # Run Integration Tests Against Live Stack
      # set -o pipefail ensures a non-zero exit from the test script
      # propagates even when piped into tee
      # =========================
      - name: Run Integration Tests
        run: |
          set -o pipefail
          chmod +x tests/test_integration.sh
          ./tests/test_integration.sh 2>&1 | tee integration-test-results.txt

      # =========================
      # Dump Compose Logs on Failure
      # Only runs when a step has failed — helps diagnose test failures
      # =========================
      - name: Dump Compose Logs on Failure
        if: failure()
        run: docker compose logs

      # =========================
      # Upload Test Results as Artifact
      # Always upload — even on failure — so results are always inspectable
      # Path is relative to repo root (not working-directory)
      # =========================
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: app/integration-test-results.txt
          if-no-files-found: warn

      # =========================
      # Tear Down Stack
      # Always runs — cleans containers, networks, and volumes
      # =========================
      - name: Tear Down Stack
        if: always()
        run: docker compose down -v --remove-orphans
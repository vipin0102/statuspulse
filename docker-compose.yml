version: "3.9"

services:
  app:
#    build:
#      context: .
#      dockerfile: Dockerfile
    image: ${APP_IMAGE:-statuspulse:ci}
    container_name: statuspulse-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - statuspulse-network

  postgres:
    image: postgres:16-alpine
    container_name: statuspulse-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - statuspulse-network

  redis:
    image: redis:7-alpine
    container_name: statuspulse-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - statuspulse-network

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: statuspulse-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
      - UPTIME_KUMA_BASE_PATH=/status
    expose:
      - "3001"
    networks:
      - statuspulse-network

  caddy:
    image: caddy:2-alpine
    container_name: statuspulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    depends_on:
      - app
      - uptime-kuma
    networks:
      - statuspulse-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:

networks:
  statuspulse-network:
    driver: bridge